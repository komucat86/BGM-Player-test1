<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGM Master Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip & FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- バックグラウンド維持用の無音オーディオストリーム -->
    <audio id="silentAudio" loop style="display:none;" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

    <div class="w-full max-w-4xl mx-auto space-y-6">
        <!-- ヘッダー -->
        <header class="flex flex-col md:flex-row items-center justify-between bg-slate-900/80 backdrop-blur border border-slate-800 p-6 rounded-2xl shadow-2xl gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">BGM Master Player</h1>
                <p class="text-sm text-slate-400 mt-1">幅広い音声対応・フェード制御・ZIP一括管理・メディアキー対応</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <label class="cursor-pointer bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-4 py-2.5 rounded-xl shadow transition flex items-center gap-2 text-sm">
                    📁 音声追加
                    <input type="file" id="audioFileInput" multiple accept="audio/*" class="hidden">
                </label>
                <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2.5 rounded-xl shadow transition flex items-center gap-2 text-sm">
                    📦 ZIP読込
                    <input type="file" id="zipFileInput" accept=".zip" class="hidden">
                </label>
                <button id="exportZipBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-4 py-2.5 rounded-xl border border-slate-700 shadow transition flex items-center gap-2 text-sm">
                    💾 ZIP保存
                </button>
            </div>
        </header>

        <!-- メインパネル -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- プレイリスト部 (2カラム) -->
            <div class="md:col-span-2 bg-slate-900/60 backdrop-blur border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-col h-[420px]">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
                        🎵 プレイリスト <span id="trackCount" class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-400">0 曲</span>
                    </h2>
                    <button id="clearPlaylistBtn" class="text-xs text-rose-400 hover:text-rose-300 transition">全クリア</button>
                </div>
                <div id="playlistContainer" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                    <div id="emptyMessage" class="h-full flex flex-col items-center justify-center text-slate-500 text-sm text-center p-6 border-2 border-dashed border-slate-800 rounded-xl">
                        音声ファイル（MP3, FLAC, WAV, OGG, AAC等）またはZIPをドラッグ＆ドロップするか、上のボタンから追加してください。
                    </div>
                </div>
            </div>

            <!-- コントロール・設定部 (1カラム) -->
            <div class="bg-slate-900/60 backdrop-blur border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-col justify-between space-y-6">
                <!-- 現在の再生状況 -->
                <div class="space-y-3">
                    <h2 class="text-lg font-semibold text-slate-200">🎛️ 再生ステータス</h2>
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                        <div class="text-xs text-slate-400 uppercase tracking-wider">現在再生中</div>
                        <div id="currentTrackTitle" class="text-base font-bold text-cyan-400 truncate">停止中</div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div id="progressBar" class="bg-cyan-500 h-full w-0 transition-all duration-150"></div>
                        </div>
                    </div>
                </div>

                <!-- フェード時間設定 -->
                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-slate-400">フェード時間</span>
                        <span id="fadeValue" class="font-bold text-cyan-400">1.5秒</span>
                    </div>
                    <input type="range" id="fadeDurationRange" min="0.1" max="5.0" step="0.1" value="1.5" class="w-full accent-cyan-500 cursor-pointer">
                </div>

                <!-- 操作ボタン一覧 -->
                <div class="grid grid-cols-2 gap-3">
                    <button id="stopBtn" class="bg-rose-600/80 hover:bg-rose-600 text-white font-medium py-3 px-4 rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
                        ⏹️ 停止 [S]
                    </button>
                    <button id="testAudioBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 px-4 rounded-xl border border-slate-700 shadow transition text-sm flex items-center justify-center gap-2">
                        ✨ テスト音生成
                    </button>
                </div>
            </div>
        </div>

        <!-- キーボード・ショートカット説明 -->
        <footer class="bg-slate-900/40 border border-slate-800/80 p-4 rounded-xl text-xs text-slate-400 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <span><kbd class="bg-slate-800 px-2 py-1 rounded text-cyan-400 font-mono">W</kbd> BGM1</span>
                <span><kbd class="bg-slate-800 px-2 py-1 rounded text-cyan-400 font-mono">E</kbd> BGM2</span>
                <span><kbd class="bg-slate-800 px-2 py-1 rounded text-cyan-400 font-mono">R</kbd> BGM3</span>
                <span><kbd class="bg-slate-800 px-2 py-1 rounded text-rose-400 font-mono">S</kbd> 停止 (フェードアウト)</span>
                <span><kbd class="bg-slate-800 px-2 py-1 rounded text-slate-300 font-mono">Space</kbd> 再生/一時停止</span>
            </div>
            <div class="text-slate-500">
                ※物理メディアキー（次の曲ボタン等）による順次切替にも対応
            </div>
        </footer>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        let audioCtx = null;
        let playlist = []; // { name, file, buffer }
        let activeSources = []; // 鳴っている音源とゲインを全て管理する配列
        let currentPlayingIndex = -1;
        let isInitialized = false;

        const silentAudio = document.getElementById('silentAudio');
        const audioFileInput = document.getElementById('audioFileInput');
        const zipFileInput = document.getElementById('zipFileInput');
        const exportZipBtn = document.getElementById('exportZipBtn');
        const playlistContainer = document.getElementById('playlistContainer');
        const emptyMessage = document.getElementById('emptyMessage');
        const trackCountEl = document.getElementById('trackCount');
        const currentTrackTitle = document.getElementById('currentTrackTitle');
        const stopBtn = document.getElementById('stopBtn');
        const testAudioBtn = document.getElementById('testAudioBtn');
        const fadeDurationRange = document.getElementById('fadeDurationRange');
        const fadeValue = document.getElementById('fadeValue');
        const progressBar = document.getElementById('progressBar');

        // AudioContext 初期化 & バックグラウンド維持起動
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            silentAudio.play().catch(() => {});
            isInitialized = true;
        }

        // タブ切り替え・可視性変更時の自動復旧
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                silentAudio.play().catch(() => {});
            }
        });

        // フェード時間表示
        fadeDurationRange.addEventListener('input', (e) => {
            fadeValue.textContent = `${e.target.value}秒`;
        });

        // ファイル選択追加
        audioFileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            for (const file of files) {
                await addTrackFromFile(file);
            }
            audioFileInput.value = '';
        });

        async function addTrackFromFile(file) {
            initAudioContext();
            try {
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                playlist.push({
                    name: file.name,
                    file: file,
                    buffer: audioBuffer
                });
                renderPlaylist();
            } catch (err) {
                console.error('音声のデコードに失敗しました:', file.name, err);
                alert(`「${file.name}」の読み込みに失敗しました。サポートされていない形式の可能性があります。`);
            }
        }

        // プレイリスト描画
        function renderPlaylist() {
            if (playlist.length === 0) {
                emptyMessage.style.display = 'flex';
                playlistContainer.innerHTML = '';
                playlistContainer.appendChild(emptyMessage);
                trackCountEl.textContent = '0 曲';
                updateMediaSessionMetadata();
                return;
            }

            emptyMessage.style.display = 'none';
            playlistContainer.innerHTML = '';
            trackCountEl.textContent = `${playlist.length} 曲`;

            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                const isPlaying = (currentPlayingIndex === index);
                
                item.className = `flex items-center justify-between p-3 rounded-xl border transition ${
                    isPlaying ? 'bg-cyan-950/40 border-cyan-500/50 shadow-lg shadow-cyan-950/50' : 'bg-slate-950/50 border-slate-800 hover:border-slate-700'
                }`;

                let shortcutBadge = '';
                if (index === 0) shortcutBadge = '<span class="text-[10px] bg-cyan-500/20 text-cyan-300 px-1.5 py-0.5 rounded ml-2 font-mono">W</span>';
                if (index === 1) shortcutBadge = '<span class="text-[10px] bg-cyan-500/20 text-cyan-300 px-1.5 py-0.5 rounded ml-2 font-mono">E</span>';
                if (index === 2) shortcutBadge = '<span class="text-[10px] bg-cyan-500/20 text-cyan-300 px-1.5 py-0.5 rounded ml-2 font-mono">R</span>';

                item.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="text-xs font-mono text-slate-500 w-6">#${index + 1}</span>
                        <span class="font-medium text-sm truncate text-slate-200">${escapeHtml(track.name)}</span>
                        ${shortcutBadge}
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        <button onclick="playTrack(${index})" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${
                            isPlaying ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'
                        }">
                            ${isPlaying ? '再生中' : '再生'}
                        </button>
                        <button onclick="removeTrack(${index})" class="text-slate-500 hover:text-rose-400 p-1.5 transition">✕</button>
                    </div>
                `;
                playlistContainer.appendChild(item);
            });
            updateMediaSessionMetadata();
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        window.removeTrack = function(index) {
            if (currentPlayingIndex === index) {
                stopMusic();
            } else if (currentPlayingIndex > index) {
                currentPlayingIndex--;
            }
            playlist.splice(index, 1);
            renderPlaylist();
        };

        document.getElementById('clearPlaylistBtn').addEventListener('click', () => {
            if (confirm('プレイリストを全てクリアしますか？')) {
                stopMusic();
                playlist = [];
                renderPlaylist();
            }
        });

        // 音楽再生（現在鳴っている音源を全て確実にフェードアウトさせて排他制御する）
        window.playTrack = function(index) {
            if (!playlist[index]) return;
            initAudioContext();

            const fadeDuration = parseFloat(fadeDurationRange.value);
            const now = audioCtx.currentTime;

            // 既にアクティブな音源が少しでもあれば、すべてフェードアウトさせて停止予約
            if (activeSources.length > 0) {
                const oldSources = [...activeSources];
                activeSources = []; // リストをクリア

                oldSources.forEach(item => {
                    try {
                        item.gainNode.gain.cancelScheduledValues(now);
                        item.gainNode.gain.setValueAtTime(item.gainNode.gain.value, now);
                        item.gainNode.gain.linearRampToValueAtTime(0, now + fadeDuration);
                        setTimeout(() => {
                            try { item.source.stop(); item.source.disconnect(); } catch(e){}
                        }, fadeDuration * 1000 + 50);
                    } catch(e) {}
                });
            }

            currentPlayingIndex = index;
            renderPlaylist();

            const track = playlist[index];
            currentTrackTitle.textContent = track.name;

            // 新しいソースとゲインノードを作成
            const source = audioCtx.createBufferSource();
            source.buffer = track.buffer;
            source.loop = true;

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(1.0, now + fadeDuration);

            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            source.start(now);

            const activeItem = { source, gainNode, index };
            activeSources.push(activeItem);

            source.onended = () => {
                // 終了した音源を配列から除外
                activeSources = activeSources.filter(item => item.source !== source);
                if (currentPlayingIndex === index && activeSources.length === 0) {
                    currentPlayingIndex = -1;
                    currentTrackTitle.textContent = '停止中';
                    renderPlaylist();
                }
            };
        };

        // 停止（現在アクティブな音源をすべてフェードアウト）
        function stopMusic() {
            if (activeSources.length === 0) return;
            initAudioContext();

            const fadeDuration = parseFloat(fadeDurationRange.value);
            const now = audioCtx.currentTime;

            const sourcesToStop = [...activeSources];
            activeSources = [];

            sourcesToStop.forEach(item => {
                try {
                    item.gainNode.gain.cancelScheduledValues(now);
                    item.gainNode.gain.setValueAtTime(item.gainNode.gain.value, now);
                    item.gainNode.gain.linearRampToValueAtTime(0, now + fadeDuration);

                    setTimeout(() => {
                        try {
                            item.source.stop();
                            item.source.disconnect();
                        } catch(e) {}
                    }, fadeDuration * 1000 + 50);
                } catch(e) {}
            });

            currentPlayingIndex = -1;
            currentTrackTitle.textContent = '停止中';
            renderPlaylist();
        }

        stopBtn.addEventListener('click', stopMusic);

        // キーボード操作 (W, E, R, S, Space)
        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

            const key = e.key.toUpperCase();
            if (key === 'W') {
                if (playlist.length > 0) playTrack(0);
            } else if (key === 'E') {
                if (playlist.length > 1) playTrack(1);
            } else if (key === 'R') {
                if (playlist.length > 2) playTrack(2);
            } else if (key === 'S') {
                stopMusic();
            } else if (e.code === 'Space') {
                e.preventDefault();
                if (currentPlayingIndex !== -1) {
                    stopMusic();
                } else if (playlist.length > 0) {
                    playTrack(0);
                }
            }
        });

        // ZIPエクスポート
        exportZipBtn.addEventListener('click', async () => {
            if (playlist.length === 0) {
                alert('エクスポートする音声ファイルがありません。');
                return;
            }
            const zip = new JSZip();
            for (const track of playlist) {
                zip.file(track.name, track.file);
            }
            const content = await zip.generateAsync({ type: 'blob' });
            saveAs(content, 'bgm_playlist.zip');
        });

        // ZIPインポート
        zipFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            initAudioContext();
            try {
                const zip = new JSZip();
                const contents = await zip.loadAsync(file);
                for (const [filename, zipEntry] of Object.entries(contents.files)) {
                    if (zipEntry.dir) continue;
                    const blob = await zipEntry.async('blob');
                    const audioFile = new File([blob], filename, { type: blob.type || 'audio/mpeg' });
                    await addTrackFromFile(audioFile);
                }
                alert('ZIPからプレイリストを読み込みました！');
            } catch (err) {
                console.error(err);
                alert('ZIPファイルの読み込みに失敗しました。');
            }
            zipFileInput.value = '';
        });

        // テスト音声生成（デモ用）
        testAudioBtn.addEventListener('click', async () => {
            initAudioContext();
            const sampleRate = audioCtx.sampleRate;
            const createBeepBuffer = (freq, duration) => {
                const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < buffer.length; i++) {
                    data[i] = Math.sin(2 * Math.PI * freq * i / sampleRate) * Math.exp(-i / (sampleRate * 0.5));
                }
                return buffer;
            };

            playlist.push({
                name: `BGM_1 (テスト440Hz)`,
                file: new File([], `bgm_1.wav`),
                buffer: createBeepBuffer(440, 5)
            });
            playlist.push({
                name: `BGM_2 (テスト880Hz)`,
                file: new File([], `bgm_2.wav`),
                buffer: createBeepBuffer(880, 5)
            });
            playlist.push({
                name: `BGM_3 (テスト1320Hz)`,
                file: new File([], `bgm_3.wav`),
                buffer: createBeepBuffer(1320, 5)
            });

            renderPlaylist();
            alert('テスト用の3曲（BGM1, BGM2, BGM3）を追加しました！W/E/Rキーでお試しください。');
        });

        // MediaSession API 連携（物理メディアキー・ヘッドセット・コントローラー対応）
        function updateMediaSessionMetadata() {
            if (!('mediaSession' in navigator)) return;

            if (playlist.length > 0 && currentPlayingIndex !== -1) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: playlist[currentPlayingIndex].name,
                    artist: 'BGM Master Player',
                    album: 'Custom Playlist'
                });
            } else {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: '停止中',
                    artist: 'BGM Master Player',
                    album: 'Custom Playlist'
                });
            }
        }

        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => {
                if (currentPlayingIndex === -1 && playlist.length > 0) {
                    playTrack(0);
                }
            });
            navigator.mediaSession.setActionHandler('pause', stopMusic);
            navigator.mediaSession.setActionHandler('stop', stopMusic);
            
            // 次の曲ボタンで BGM1 → BGM2 → BGM3 と順番にループ切替
            navigator.mediaSession.setActionHandler('nexttrack', () => {
                if (playlist.length === 0) return;
                const nextIndex = (currentPlayingIndex + 1) % playlist.length;
                playTrack(nextIndex);
            });
            
            navigator.mediaSession.setActionHandler('previoustrack', () => {
                if (playlist.length === 0) return;
                const prevIndex = (currentPlayingIndex - 1 + playlist.length) % playlist.length;
                playTrack(prevIndex);
            });
        }
    </script>
</body>
</html>
